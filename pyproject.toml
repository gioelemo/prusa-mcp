[project]
name = "prusa-mcp"
version = "0.1.0"
description = "MCP server for controlling Prusa 3D printers via Prusa Connect"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "GPL-3.0"}
authors = [
    {name = "Gioele Molinari", email = "gioelemo@ethz.ch"}
]
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.18.0",
    "pywebview>=5.0",
]

[project.scripts]
prusa-mcp = "prusa_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prusa_mcp"]

[project.optional-dependencies]
dev = [
  "mypy",
  "ruff",
  "pre-commit",
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 124
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN",    # flake8-annotations (mypy/pyright's job)
    "COM812", # missing-trailing-comma (conflicts with formatter)
    "CPY",    # flake8-copyright
    "D105",   # undocumented-magic-method
    "D107",   # undocumented-public-init
    "D401",   # non-imperative-mood
    "E501",   # line-too-long (formatter's job)
    "EM101",  # raw-string-in-exception
    "EM102",  # f-string-in-exception
    "E741",   # ambiguous-variable-name
    "FIX002", # flake8-fixme
    "PTH",    # flake8-use-pathlib
    "S101",   # assert
    "S301",   # suspicious-pickle-usage
    "S603",   # subprocess-without-shell-equals-true
    "S607",   # start-process-with-partial-path
    "T201",   # print
    "TRY003", # raise-vanilla-args
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
known-first-party = ["prusa_mcp"]
force-single-line = true
force-sort-within-sections = true
single-line-exclusions = ["typing", "collections.abc", "typing_extensions"]
order-by-type = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401", "D104", "E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src/**"]
reportMissingImports = "none"
reportMissingModuleSource = "none"

[tool.mypy]
warn_redundant_casts = true
warn_unused_ignores = false
files = ["src/"]
exclude = [
  "^build/",
  "^docs/",
]
[[tool.mypy.overrides]]
module = [
    "httpx",
    "webview",
]
ignore_missing_imports = true
